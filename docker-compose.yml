services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-produits_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-produits_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-produits_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-produits_user} -d ${POSTGRES_DB:-produits_db}"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-produits_user}:${POSTGRES_PASSWORD:-produits_pwd}@db:5432/${POSTGRES_DB:-produits_db}
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8001
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
