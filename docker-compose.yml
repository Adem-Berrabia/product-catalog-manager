services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: produits_user
      POSTGRES_PASSWORD: produits_pwd
      POSTGRES_DB: produits_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U produits_user -d produits_db"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://produits_user:produits_pwd@db:5432/produits_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
